name: Günlük kurlar

on:
  schedule:
    # 03:10 UTC = 06:10 Türkiye saati (GMT+3)
    - cron: "10 3 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurları gönder
        env:
          MARKETS_BOT_TOKEN: ${{ secrets.MARKETS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python markets_bot.py
